name: DaveHub external project destination verification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'content/public/catalogue.json'
      - 'scripts/check-external-destinations.cjs'
      - '.github/workflows/davehub-external-destinations.yml'
permissions:
  contents: read
jobs:
  verify-links:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify the approved external website URLs actually respond
        run: node scripts/check-external-destinations.cjs
