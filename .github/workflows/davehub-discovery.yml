name: DaveHub Ready repository discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '17 8 * * 1'
  pull_request:
    paths:
      - 'davehub.json'
      - 'scripts/davehub-*.cjs'
      - 'tests/davehub-discovery.test.cjs'
      - 'tests/workshop.test.cjs'
      - 'tools/workshop/**'
      - 'scripts/build-pages.sh'
      - 'prototypes/dh-11c-cabinet/**'
      - 'tests/dh11c-cabinet-geometry.test.cjs'
      - 'scripts/render-content.cjs'
      - 'scripts/render-dh11-worlds.cjs'
      - 'assets/content/dh11-worlds.css'
      - 'tests/render-content.test.cjs'
      - 'tests/dh11-worlds.test.cjs'
      - '.node-version'
      - 'scripts/check-cloudflare-staging.cjs'
      - 'scripts/bundle-games.cjs'
      - 'tests/game-bundles.test.cjs'
      - 'config/game-releases.json'
      - 'config/game-auto-sync-policy.json'
      - 'config/deployment-topology.json'
      - 'scripts/dh09d-topology.cjs'
      - 'tests/dh09d-topology.test.cjs'
      - 'scripts/verify-dh09d-staging-cutover.cjs'
      - 'tests/dh09d-cutover-verification.test.cjs'
      - '.github/workflows/dh09d-staging-cutover-verification.yml'
      - 'scripts/auto-sync-unicorn.cjs'
      - 'scripts/verify-game-staging-release.cjs'
      - 'tests/game-auto-sync.test.cjs'
      - '.github/workflows/davehub-game-auto-sync.yml'
      - 'tests/game-staging-verification.test.cjs'
      - 'tests/game-deployment-health.test.cjs'
      - 'scripts/check-pinned-game-deployment.cjs'
      - 'functions/games/**'
      - 'scripts/render-review-layout.cjs'
      - 'tests/review-layout.test.cjs'
      - 'content/public/catalogue.json'
      - 'scripts/render-editorial-review.cjs'
      - 'scripts/check-dh10c-staging.cjs'
      - 'tests/dh10c-editorial.test.cjs'
      - 'tests/dh10c-hosted-http.test.cjs'
      - 'assets/editorial/**'
      - '.github/workflows/davehub-discovery.yml'
  push:
    branches: [main, staging]
    paths:
      - 'davehub.json'
      - 'scripts/davehub-*.cjs'
      - 'tests/davehub-discovery.test.cjs'
      - 'tests/workshop.test.cjs'
      - 'tools/workshop/**'
      - 'scripts/build-pages.sh'
      - 'prototypes/dh-11c-cabinet/**'
      - 'tests/dh11c-cabinet-geometry.test.cjs'
      - 'scripts/render-content.cjs'
      - 'scripts/render-dh11-worlds.cjs'
      - 'assets/content/dh11-worlds.css'
      - 'tests/render-content.test.cjs'
      - 'tests/dh11-worlds.test.cjs'
      - '.node-version'
      - 'scripts/check-cloudflare-staging.cjs'
      - 'scripts/bundle-games.cjs'
      - 'tests/game-bundles.test.cjs'
      - 'config/game-releases.json'
      - 'config/game-auto-sync-policy.json'
      - 'config/deployment-topology.json'
      - 'scripts/dh09d-topology.cjs'
      - 'tests/dh09d-topology.test.cjs'
      - 'scripts/verify-dh09d-staging-cutover.cjs'
      - 'tests/dh09d-cutover-verification.test.cjs'
      - '.github/workflows/dh09d-staging-cutover-verification.yml'
      - 'scripts/auto-sync-unicorn.cjs'
      - 'scripts/verify-game-staging-release.cjs'
      - 'tests/game-auto-sync.test.cjs'
      - '.github/workflows/davehub-game-auto-sync.yml'
      - 'tests/game-staging-verification.test.cjs'
      - 'tests/game-deployment-health.test.cjs'
      - 'scripts/check-pinned-game-deployment.cjs'
      - 'functions/games/**'
      - 'scripts/render-review-layout.cjs'
      - 'tests/review-layout.test.cjs'
      - 'content/public/catalogue.json'
      - 'scripts/render-editorial-review.cjs'
      - 'scripts/check-dh10c-staging.cjs'
      - 'tests/dh10c-editorial.test.cjs'
      - 'tests/dh10c-hosted-http.test.cjs'
      - 'assets/editorial/**'
      - '.github/workflows/davehub-discovery.yml'
permissions:
  contents: read
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate manifest contract and scanner
        run: node --test tests/davehub-discovery.test.cjs
      - name: Build entire DaveHub site with content and navigation regressions
        run: sh scripts/build-pages.sh
      - name: Discover public repositories with explicit DaveHub markers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/davehub-discover.cjs --owner tametheboardgame --out reports/davehub-discovery.json
      - name: Prepare private Content Workshop import (unapproved)
        if: success()
        run: node scripts/davehub-workshop-import.cjs reports/davehub-discovery.json reports/davehub-workshop-import.json
      - name: Audit new public repositories for default-off DaveHub markers
        if: success()
        run: node scripts/davehub-audit.cjs reports/davehub-discovery.json
      - name: Upload review-only discovery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: davehub-ready-discovery
          path: |
            reports/davehub-discovery.json
            reports/davehub-workshop-import.json
          if-no-files-found: ignore
          retention-days: 7
# This workflow validates PR changes, runs once on initial main integration, and then weekly or on demand.
# It makes NO commits, pull requests, deployments or site catalogue changes.
# Its artifact contains only explicitly public source-repository metadata.
