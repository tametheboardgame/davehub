name: Cloudflare staging HTTP smoke
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render-content.cjs'
      - 'scripts/render-review-layout.cjs'
      - 'scripts/check-cloudflare-staging.cjs'
      - 'assets/content/worlds.css'
      - 'assets/content/staging-review.js'
      - 'scripts/build-pages.sh'
      - '.node-version'
      - 'scripts/bundle-games.cjs'
      - 'scripts/check-game-routes.cjs'
      - 'scripts/verify-game-staging-release.cjs'
      - 'config/game-releases.json'
      - 'config/game-auto-sync-policy.json'
      - 'scripts/auto-sync-unicorn.cjs'
      - 'scripts/verify-game-staging-release.cjs'
      - 'tests/game-auto-sync.test.cjs'
      - 'tests/game-staging-verification.test.cjs'
      - 'functions/games/**'
      - 'content/public/catalogue.json'
      - '.github/workflows/davehub-staging-smoke.yml'
permissions:
  contents: read
jobs:
  deployed-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify actual deployed Cloudflare staging pages
        run: node scripts/check-cloudflare-staging.cjs
      - name: Verify both same-origin games, files and audio on Cloudflare
        run: node scripts/check-game-routes.cjs
      - name: Verify exact published game SHA and release version on Cloudflare
        run: node scripts/verify-game-staging-release.cjs
