name: Cloudflare staging HTTP smoke
on:
  workflow_dispatch:
  push:
    branches: [main, staging]
    paths:
      - 'scripts/render-content.cjs'
      - 'scripts/render-dh11-worlds.cjs'
      - 'assets/content/dh11-worlds.css'
      - 'tests/dh11-worlds.test.cjs'
      - 'scripts/render-editorial-review.cjs'
      - 'scripts/check-dh10c-staging.cjs'
      - 'assets/editorial/**'
      - 'tests/dh10c-editorial.test.cjs'
      - 'scripts/render-review-layout.cjs'
      - 'scripts/check-cloudflare-staging.cjs'
      - 'assets/content/worlds.css'
      - 'assets/content/staging-review.js'
      - 'scripts/build-pages.sh'
      - 'prototypes/dh-11c-cabinet/**'
      - 'prototypes/dh-11c-room/**'
      - 'tests/dh11c-room.test.cjs'
      - 'scripts/render-dh11c-art-lab.cjs'
      - 'tests/dh11c-art-direction.test.cjs'
      - 'scripts/build-dh11c4-cabinet-glb.cjs'
      - 'scripts/render-dh11c4-glb-proof.cjs'
      - 'tests/dh11c4-cabinet-glb.test.cjs'
      - 'scripts/build-dh11c4c-blender-model.cjs'
      - 'scripts/render-dh11c4c-architecture.cjs'
      - 'tests/dh11c4c-room-architecture.test.cjs'
      - 'tests/dh11c4d-immersive-viewport.test.cjs'
      - 'prototypes/dh-11c-room/immersive.css'
      - 'prototypes/dh-11c-room/immersive-ui.js'
      - 'assets/worlds/writing/3d/models/**'
      - 'tests/dh11c-cabinet-geometry.test.cjs'
      - '.node-version'
      - 'scripts/bundle-games.cjs'
      - 'scripts/check-game-routes.cjs'
      - 'scripts/verify-game-staging-release.cjs'
      - 'config/game-releases.json'
      - 'config/game-auto-sync-policy.json'
      - 'config/deployment-topology.json'
      - 'scripts/dh09d-topology.cjs'
      - 'tests/dh09d-topology.test.cjs'
      - 'scripts/auto-sync-unicorn.cjs'
      - 'scripts/verify-game-staging-release.cjs'
      - 'tests/game-auto-sync.test.cjs'
      - 'tests/game-staging-verification.test.cjs'
      - 'tests/game-deployment-health.test.cjs'
      - 'scripts/check-pinned-game-deployment.cjs'
      - 'functions/games/**'
      - 'content/public/catalogue.json'
      - '.github/workflows/davehub-staging-smoke.yml'
permissions:
  contents: read
jobs:
  deployed-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Identify actual staging branch before testing its public URL
        id: target
        run: node scripts/dh09d-topology.cjs select
      - name: Verify actual deployed Cloudflare staging pages
        if: github.ref_name == steps.target.outputs.branch || github.event_name == 'workflow_dispatch'
        run: node scripts/check-cloudflare-staging.cjs
      - name: Verify both same-origin games, files and audio on Cloudflare
        if: github.ref_name == steps.target.outputs.branch || github.event_name == 'workflow_dispatch'
        run: node scripts/check-game-routes.cjs
      - name: Verify exact published game SHA and release version on Cloudflare
        if: github.ref_name == steps.target.outputs.branch || github.event_name == 'workflow_dispatch'
        run: node scripts/verify-game-staging-release.cjs
      - name: Verify hosted DH-10C editorial review desk on real Cloudflare
        if: github.ref_name == steps.target.outputs.branch || github.event_name == 'workflow_dispatch'
        run: node scripts/check-dh10c-staging.cjs
