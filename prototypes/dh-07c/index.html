const demo='<span class="demo">Fictional design prototype</span>';
function nav(){const r=route();document.querySelector('#nav-shelf').classList.toggle('active',r.view==='shelf');document.querySelector('#nav-musical').classList.toggle('active',r.view==='musical');document.querySelector('#nav-shelf').setAttribute('aria-current',r.view==='shelf'?'page':'false');document.querySelector('#nav-musical').setAttribute('aria-current',r.view==='musical'?'page':'false');}
function shelfLanding(){return `<section class="shelf-hero"><div><div class="eyebrow">Behind the finished things</div><h1 class="serif">The Unfinished<br><i>Shelf.</i></h1><p class="intro lead">A resting place for ideas that had their moment. Half-written scripts, improbable musicals and stories that have no intention of getting any further.</p>${demo}<p class="note" style="margin-top:20px">Not a backlog. Not coming soon. Just worth remembering.</p></div><div class="shelf-visual" aria-hidden="true"><div class="shelf-dust">Some ideas prefer to stay here.</div><div class="books"><div class="book" style="--h:175px;--c:#637087"></div><div class="book" style="--h:224px;--c:#876050"></div><div class="book" style="--h:183px;--c:#406965"></div><div class="book" style="--h:260px;--c:#a47c4d"></div><div class="book" style="--h:190px;--c:#6e4c71"></div><div class="book" style="--h:230px;--c:#3f577b"></div><div class="book" style="--h:166px;--c:#8c5461"></div></div><span class="shelf-corner">EST. SOME TIME AGO</span></div></section><div class="sep"></div><section aria-labelledby="shelf-heading"><div class="section-title"><div><div class="eyebrow">Collected fragments</div><h2 class="serif" id="shelf-heading">Browse the shelf</h2><p>Every project is fictional here, but the structure is ready.</p></div><span class="pill" id="count">6 ideas kept safe</span></div><div class="searchbar"><label class="search"><span aria-hidden="true">⌕&nbsp;</span><span class="sr">Search unfinished works</span><input id="search" type="search" placeholder="Search the forgotten ideas…" value="${escape(search)}"></label><div class="chips" role="group" aria-label="Filter by format">${['All','Script','Book','Musical','Idea'].map(x=>`<button class="chip${filter===x?' active':''}" data-filter="${x}" aria-pressed="${filter===x}">${x==='All'?'Everything':x+'s'}</button>`).join('')}</div></div><div class="card-grid" id="works"></div></section>`}
function renderShelfCards(){const box=document.getElementById('works');if(!box)return;let list=data.shelved.filter(w=>(filter==='All'||w.kind===filter)&&[w.title,w.summary,w.kind].join(' ').toLowerCase().includes(search.toLowerCase()));document.getElementById('count').textContent=`${list.length} ${list.length===1?'idea':'ideas'} kept safe`;box.innerHTML=list.length?list.map(w=>`<a href="?view=shelf&amp;item=${w.id}" class="work-card" data-item="${w.id}"><div class="work-art" style="--art:${w.art}" aria-hidden="true"><span>${w.mark}</span></div><div class="work-card-body"><div class="work-meta">${w.kind} · ${w.year}</div><h3>${escape(w.title)}</h3><p>${escape(w.summary)}</p><div><span class="pill">${w.status}</span></div><div class="work-more">Explore the fragments <span aria-hidden="true">↗</span></div></div></a>`).join(''):'<div class="empty" style="grid-column:1/-1">Nothing on this part of the shelf. Try another search or format.</div>';box.querySelectorAll('[data-item]').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go('shelf',a.dataset.item)}));}
function shelfDetail(w){return `<div class="detail-hero"><div class="eyebrow">The Unfinished Shelf / ${w.kind}</div><h1 class="serif">${escape(w.title)}</h1><p class="intro">${escape(w.summary)}</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin:15px 0 0"><span class="pill">${w.status}</span><span class="pill">${w.year}</span></div></div><div class="sep"></div><div class="detail-cols"><article class="paper"><div class="archive-kicker">From the archive · Fictional example</div><h2 class="serif" style="margin:14px 0">What it was meant to be</h2><p>${escape(w.idea)}</p><h2 class="serif" style="margin:24px 0 8px;font-size:26px">A note in the margin</h2><p>${escape(w.note)}</p><small>Illustrative writing only. No actual private script has been imported.</small></article><aside class="archive-panel"><h3>What survives</h3><ul>${w.survives.map(s=>`<li>${escape(s)}</li>`).join('')}</ul><p class="note">In the finished site, approved excerpts, scans or recordings could appear here.</p><div class="sep" style="margin:20px 0"></div><h3>Where it belongs</h3><p class="note">Writing · The Unfinished Shelf · Trip Down Memory Lane (when appropriate)</p></aside></div><a href="?view=shelf" data-back-shelf class="back-inline">← Back to the shelf</a>`}
function musicalPage(){const m=data.musical;return `<div style="padding-top:23px">${demo}</div><section class="musical-hero"><div class="musical-words"><div class="eyebrow">A musical world / Concept preview</div><h1 class="serif">The Last<br><em>Lightkeeper.</em></h1><p class="intro">${escape(m.tagline)}</p><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:23px"><span class="pill">Stage musical</span><span class="pill">Fictional concept</span><span class="pill">Story + music + script</span></div></div><div class="musical-visual" role="img" aria-label="Illustrated silhouette of a lighthouse beneath a moonlit sky"><div class="moon"></div><div class="water"></div><div class="cliff"></div><div class="beam"></div><div class="light"></div>${Array.from({length:18},(_,i)=>`<span class="sky-star" style="left:${(i*47+13)%97}%;top:${(i*29+5)%67}%"></span>`).join('')}</div></section><div role="tablist" class="tab-strip" aria-label="Musical sections">${[['overview','The Show'],['listen','Listen'],['script','The Script'],['making','The Making Of'],['releases','Releases & Credits']].map(([id,label])=>`<button type="button" role="tab" id="tab-${id}" data-tab="${id}" aria-selected="${activeTab===id}" aria-controls="musical-panel" tabindex="${activeTab===id?0:-1}">${label}</button>`).join('')}</div><section id="musical-panel" role="tabpanel" aria-labelledby="tab-${activeTab}" class="music-pane">${tabContent()}</section>`}
function tabContent(){const m=data.musical;if(activeTab==='overview')return `<div class="two-col"><article class="body-card"><div class="eyebrow">The premise</div><h2 class="serif">The sun didn't show up.</h2><p>${escape(m.story)}</p><p>${escape(m.world)}</p><button type="button" class="button" data-open-tab="listen">Explore the songs ↗</button></article><aside class="body-card"><div class="eyebrow">People in the story</div><h2 class="serif">The cast</h2>${m.characters.map(c=>`<div class="fact-line" style="display:block"><strong>${escape(c.name)}</strong><div style="margin-top:5px">${escape(c.role)}</div></div>`).join('')}</aside></div>`;
if(activeTab==='listen'){const t=m.tracks.find(x=>x.id===activeTrack)||m.tracks[0];return `<div class="section-title"><div><div class="eyebrow">Music as part of the story</div><h2 class="serif">Listen to the show</h2><p>Choose a song to see its place in the narrative.</p></div><span class="pill">4 fictional track concepts</span></div><div class="track-list">${m.tracks.map((t,i)=>`<div class="track ${t.id===activeTrack?'selected':''}"><span class="track-index">${String(i+1).padStart(2,'0')}</span><div><h3>${escape(t.title)}</h3><p>Act ${t.act} · ${t.status}</p></div><button type="button" data-track="${t.id}" aria-pressed="${t.id===activeTrack}">Show story link</button></div>`).join('')}</div><div class="track-detail"><div class="eyebrow">Selected song</div><h3>${escape(t.title)}</h3><p>${escape(t.desc)}</p><button type="button" class="muted-link" data-scene-from-track="${t.scene}">Read the associated script scene →</button><p class="note" style="margin:15px 0 0">No audio is supplied in this fictional demo. The real page would use approved streaming links or licensed embeds, not a pretend player.</p></div>`}
if(activeTab==='script'){const s=m.scenes.find(x=>x.id===activeScene)||m.scenes[0];const song=m.tracks.find(t=>t.id===s.song);return `<div class="section-title"><div><div class="eyebrow">Script &amp; scenes</div><h2 class="serif">A story you can listen to</h2><p>Scenes connect directly to the music associated with them.</p></div></div><div class="script-grid"><div class="scene-list">${m.scenes.map(s=>`<div class="scene-card ${s.id===activeScene?'selected':''}"><div><strong>${s.title}</strong><p>${s.label}</p></div><button type="button" data-scene="${s.id}">Read</button></div>`).join('')}</div><article class="script-paper"><p class="script-caption">${s.label} / illustrative excerpt</p><h2 class="serif">${s.title}</h2><p class="script-line">${escape(s.excerpt)}</p><hr style="border:0;border-top:1px solid #d9cbb9;margin:20px 0"><p style="font-size:13px">Associated song: <strong>${escape(song.title)}</strong></p><button class="muted-link" type="button" style="color:#2f536b" data-track-from-scene="${song.id}">See this song →</button><p style="font-size:11px;margin-top:25px;color:#747c85">Fictional script sample, not extracted from an actual draft.</p></article></div>`}
if(activeTab==='making')return `<div class="two-col"><section><h2 class="serif">How this might have come together</h2><div class="milestones"><div class="milestone"><small>Early sketch</small><h3>What if sunrise simply stopped?</h3><p>A single absurd question becomes the premise of an entire world.</p></div><div class="milestone"><small>Concept development</small><h3>Inventing the harbour</h3><p>The setting, its people and its permanently malfunctioning lighthouse take shape.</p></div><div class="milestone"><small>Musical sketches</small><h3>Finding the songs</h3><p>Song ideas begin to link to scenes and characters, without requiring a finished script first.</p></div></div></section><aside class="body-card"><h2 class="serif">Beyond a blog post</h2><p>On the real site, this area could be drafted from approved notes, scene revisions and creative decisions, giving visitors the story behind the work without requiring a manually written blog.</p><div class="off-note">All events shown here are fictional. Automated publishing remains off until each item has been reviewed.</div></aside></div>`;
return `<div class="two-col"><article class="body-card"><div class="eyebrow">Releases</div><h2 class="serif">From stage to speakers</h2><p>A real musical could list streaming albums, demo collections, track versions, performances and scripts here, linking each back to the canonical musical.</p><div class="off-note">This is a fictional design example. No album exists and there are no external streaming links or fabricated credits.</div></article><aside class="body-card"><h2 class="serif">Credits &amp; permissions</h2><p>Each contributor, composition, lyric, recording, image and script extract would be reviewed independently before publication.</p><div class="fact-line"><span>Rights check</span><strong>Required</strong></div><div class="fact-line"><span>Approved media</span><strong>None in prototype</strong></div></aside></div>`}
function selectTab(id){activeTab=id;const panel=document.getElementById('musical-panel');if(!panel)return;document.querySelectorAll('[data-tab]').forEach(el=>{el.setAttribute('aria-selected',String(el.dataset.tab===id));el.tabIndex=el.dataset.tab===id?0:-1});panel.setAttribute('aria-labelledby','tab-'+id);panel.innerHTML=tabContent();attachMusicalHandlers();}
function attachMusicalHandlers(){document.querySelectorAll('[data-open-tab]').forEach(b=>b.onclick=()=>selectTab(b.dataset.openTab));document.querySelectorAll('[data-track]').forEach(b=>b.onclick=()=>{activeTrack=b.dataset.track;selectTab('listen')});document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>{activeScene=b.dataset.scene;selectTab('script')});document.querySelectorAll('[data-scene-from-track]').forEach(b=>b.onclick=()=>{activeScene=b.dataset.sceneFromTrack;selectTab('script')});document.querySelectorAll('[data-track-from-scene]').forEach(b=>b.onclick=()=>{activeTrack=b.dataset.trackFromScene;selectTab('listen')});}
function render(){const {view,item}=route();nav();if(view==='musical'){main.innerHTML=musicalPage();document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>selectTab(b.dataset.tab)));const list=document.querySelector('.tab-strip');list?.addEventListener('keydown',e=>{const keys=['ArrowRight','ArrowLeft','Home','End'];if(!keys.includes(e.key))return;e.preventDefault();const tabs=[...list.querySelectorAll('[data-tab]')];const at=tabs.findIndex(b=>b.dataset.tab===activeTab);const next=e.key==='Home'?0:e.key==='End'?tabs.length-1:(at+(e.key==='ArrowRight'?1:tabs.length-1))%tabs.length;selectTab(tabs[next].dataset.tab);tabs[next].focus()});attachMusicalHandlers();}else{const w=data.shelved.find(x=>x.id===item);main.innerHTML=w?shelfDetail(w):shelfLanding();if(w){main.querySelector('[data-back-shelf]')?.addEventListener('click',e=>{e.preventDefault();go('shelf')})}else{document.getElementById('search').addEventListener('input',e=>{search=e.target.value;renderShelfCards()});document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(n=>{n.classList.toggle('active',n===b);n.setAttribute('aria-pressed',String(n===b))});renderShelfCards()});renderShelfCards()}}}
window.addEventListener('popstate',render);document.querySelectorAll('.toggle a,.brand').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();go(a.id==='nav-musical'?'musical':'shelf')}));render();
})();
</script>
</body>
</html>
