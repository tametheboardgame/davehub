<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1835">
  <meta name="description" content="DaveHub. Ideas, projects, play, and whatever's next. An illustrated world for the things I've made.">
  <title>DaveHub | Ideas / Projects / Play</title>
  <link rel="preload" href="assets/homepage/floating-islands-background.png" as="image" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
  <script defer src="main.js"></script>
</head>
<body>
  <!-- SVG paths are interface glyphs, not generated illustration assets. -->
  <svg class="icon-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
    <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
    <symbol id="icon-writing" viewBox="0 0 24 24"><path d="M7 3h8l5 5v13H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M14 3v6h6M9 13h7M9 17h7"/></symbol>
    <symbol id="icon-games" viewBox="0 0 24 24"><path d="M6.9 7h10.2a4.5 4.5 0 0 1 4.4 3.8l.9 6.3a2.8 2.8 0 0 1-4.4 2.6L15 17H9l-3 2.7a2.8 2.8 0 0 1-4.4-2.6l.9-6.3A4.5 4.5 0 0 1 6.9 7Z"/><path d="M7.5 11v5m-2.5-2.5h5M16.5 11.5h.01M19 14h.01"/></symbol>
    <symbol id="icon-experiments" viewBox="0 0 24 24"><path d="M9 3h6m-4 0v7l-6.5 9.2A2.5 2.5 0 0 0 6.5 23h11a2.5 2.5 0 0 0 2-3.8L13 10V3"/><path d="M8 16h8M10 19h.01M14 18h.01"/></symbol>
    <symbol id="icon-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><ellipse cx="6.5" cy="18" rx="2.5" ry="2"/><ellipse cx="18.5" cy="16" rx="2.5" ry="2"/></symbol>
    <symbol id="icon-book-open" viewBox="0 0 24 24"><path d="M12 6a9 9 0 0 0-9-2v15a9 9 0 0 1 9 2 9 9 0 0 1 9-2V4a9 9 0 0 0-9 2v15M12 6v15"/></symbol>
    <symbol id="icon-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/></symbol>
    <symbol id="icon-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.4 8.6-2.1 4.7-4.7 2.1 2.1-4.7z"/></symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="icon-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="icon-spark" viewBox="0 0 24 24"><path d="m12 2 2.1 7.9L22 12l-7.9 2.1L12 22l-2.1-7.9L2 12l7.9-2.1z"/></symbol>
  </svg>

  <a class="skip-link" href="/worlds/">Skip to Explore DaveHub</a>

  <main class="homepage">
    <div class="world-art" aria-hidden="true"></div>
    <div class="world-colour" aria-hidden="true"></div>
    <div class="world-shade" aria-hidden="true"></div>

    <!-- DH-06D: the transparent motion clip replaces Dave's static pose when supported. -->
    <div class="dave-stage" id="dave-stage" aria-hidden="true">
      <img class="dave-stage__still" src="assets/characters/dave/dave-static-v1.webp"
           width="989" height="1448" alt="" loading="eager" decoding="async">
      <video class="dave-stage__motion" id="dave-stage-motion"
             width="480" height="854" muted playsinline preload="none" aria-hidden="true">
        <source src="assets/characters/dave/dave-animation-v1.webm" type="video/webm; codecs=vp9">
      </video>
    </div>

    <header class="page-top">
      <span class="page-top__eyebrow"><svg class="glyph" aria-hidden="true"><use href="#icon-spark"/></svg> A little universe of unfinished ideas</span>
      <span class="page-top__prototype">FIRST LOOK <span aria-hidden="true">/</span> 01</span>
    </header>

    <nav class="island-nav" aria-label="Discover destinations in the illustrated world">
      <a class="island island--writing" href="/worlds/writing/" aria-label="Explore Writing">
        <svg class="glyph" aria-hidden="true"><use href="#icon-writing"/></svg><span>Writing</span>
      </a>
      <a class="island island--games" href="/worlds/games/" aria-label="Explore Games">
        <svg class="glyph" aria-hidden="true"><use href="#icon-games"/></svg><span>Games</span>
      </a>
      <a class="island island--experiments" href="/worlds/experiments/" aria-label="Explore Experiments">
        <svg class="glyph" aria-hidden="true"><use href="#icon-experiments"/></svg><span>Experiments</span>
      </a>
      <a class="island island--projects" href="/worlds/projects/" aria-label="Explore Projects">
        <svg class="glyph" aria-hidden="true"><use href="#icon-folder"/></svg><span>Projects</span>
      </a>
    </nav>

    <section class="welcome" aria-labelledby="welcome-heading">
      <h1 id="welcome-heading" class="visually-hidden">DaveHub</h1>
      <img class="welcome__logo" src="assets/branding/davehub-logo-faithful.svg" alt="DaveHub" width="640" height="200">
      <p class="welcome__tagline">IDEAS <span>/</span> PROJECTS <span>/</span> PLAY <span>/</span> WHAT'S NEXT</p>
      <a class="explore-button" href="/worlds/">
        <svg class="glyph explore-button__compass" aria-hidden="true"><use href="#icon-compass"/></svg>
        <span>Explore DaveHub</span>
        <svg class="glyph explore-button__arrow" aria-hidden="true"><use href="#icon-arrow"/></svg>
      </a>
    </section>


    <footer class="homepage__footer"><span>Somewhere between an idea and a very bad idea.</span></footer>
  </main>

</body>
</html>
